name: Sync Acute branding
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-acute-branding.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved Acute clear icon
        run: |
          mkdir -p assets
          curl --fail --location "https://raw.githubusercontent.com/iiankehn/acute-web-ios/main/AcuteWeb/Assets.xcassets/AppIcon.appiconset/AcuteWebIcon-Clear.png" -o assets/acute-web-clear.png
      - name: Commit synchronized branding
        run: |
          if git diff --quiet -- assets/acute-web-clear.png; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/acute-web-clear.png
          git commit -m "Sync approved Acute clear branding"
          git push
